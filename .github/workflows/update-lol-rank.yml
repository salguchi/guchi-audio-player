name: Update LoL highest rank

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-lol-rank.yml'
      - 'scripts/*.mjs'
      - 'lol-rank-client.js'

permissions:
  contents: write

concurrency:
  group: update-lol-rank
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test highest-rank extraction
        run: node --test scripts/*.test.mjs
      - name: Fetch OP.GG displayed Solo/Duo peak
        run: node scripts/update-lol-rank.mjs
      - name: Save verified snapshot
        run: |
          if git diff --quiet -- lol-rank.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lol-rank.json
          git commit -m 'Update OP.GG highest rank snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
