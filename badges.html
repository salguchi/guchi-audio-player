<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>김초나 구독자 전용 배지</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #171719; color: #f4f4f6; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      main { width: min(720px, 100%); padding: 16px; }
      .card { border: 1px solid #343438; border-radius: 16px; padding: 20px; background: #202023; box-shadow: 0 12px 32px rgba(0,0,0,.24); }
      .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 19px; }
      h1 { margin: 0; font-size: clamp(18px, 4vw, 24px); letter-spacing: -.05em; }
      .switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; color: #b7b7c0; font-size: 13px; }
      .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
      .track { width: 46px; height: 26px; padding: 3px; border-radius: 999px; background: #4a4a50; transition: background .18s ease; }
      .thumb { display: block; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); transition: transform .18s ease; }
      input:checked + .track { background: #8a70f5; }
      input:checked + .track .thumb { transform: translateX(20px); }
      input:focus-visible + .track { outline: 3px solid #c5b8ff; outline-offset: 3px; }
      .badge-image { width: 100%; display: block; border-radius: 9px; }
      .strong { display: none; }
      .card.on .normal { display: none; }
      .card.on .strong { display: block; }
      .note { margin: 16px 0 0; color: #a7a7ad; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <section class="card" id="badge-card" aria-live="polite">
        <div class="top">
          <h1 id="badge-title">김초나 살구치 구독자 전용 배지</h1>
          <label class="switch">
            <span>티어변경</span>
            <input id="tier-toggle" type="checkbox" aria-label="티어변경" />
            <span class="track" aria-hidden="true"><span class="thumb"></span></span>
          </label>
        </div>
      <img class="badge-image normal" src="badge-normal-v2.png" alt="김초나 살구치 구독자 전용 배지" />
      <img class="badge-image strong" src="badge-strong-v2.png" alt="김초나 짱쎈살구치 구독자 전용 배지" />
        <p class="note" id="badge-note">스위치를 켜면 짱쎈살구치 배지로 바뀝니다.</p>
      </section>
    </main>
    <script>
      const toggle = document.querySelector('#tier-toggle');
      const card = document.querySelector('#badge-card');
      const title = document.querySelector('#badge-title');
      const note = document.querySelector('#badge-note');
      toggle.addEventListener('change', () => {
        const isOn = toggle.checked;
        card.classList.toggle('on', isOn);
        title.textContent = isOn ? '김초나 짱쎈살구치 구독자 전용 배지' : '김초나 살구치 구독자 전용 배지';
        note.textContent = isOn ? '현재 짱쎈살구치 배지를 보고 있습니다.' : '스위치를 켜면 짱쎈살구치 배지로 바뀝니다.';
      });
    </script>
  </body>
</html>
