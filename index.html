<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>사랑해요 구치</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 8px;
        background: transparent;
        color: #333;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .player {
        display: flex;
        align-items: center;
        gap: 10px;
        width: min(100%, 420px);
        min-height: 48px;
        padding: 7px 10px 7px 7px;
        border: 1px solid #d3d3d3;
        border-radius: 4px;
        background: #f7f7f7;
      }
      button {
        display: grid;
        flex: 0 0 32px;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 1px solid #b8b8b8;
        border-radius: 50%;
        padding: 0;
        color: #333;
        background: #fff;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { background: #e9e9e9; }
      button:focus-visible { outline: 2px solid #4d90fe; outline-offset: 2px; }
      input[type="range"] { width: 100%; min-width: 40px; accent-color: #777; cursor: pointer; }
      #time { min-width: 32px; color: #777; font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; }
    </style>
  </head>
  <body>
    <main class="player">
      <button id="playButton" type="button" aria-label="음성 재생">▶</button>
      <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="재생 위치">
      <span id="time">0:00</span>
      <audio id="audio" preload="metadata" playsinline>
        <source src="./김초나_4.26s.mp4" type="audio/mp4">
      </audio>
    </main>
    <script>
      const audio = document.getElementById('audio');
      const button = document.getElementById('playButton');
      const seek = document.getElementById('seek');
      const time = document.getElementById('time');

      const formatTime = (seconds) => {
        if (!Number.isFinite(seconds)) return '0:00';
        return `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;
      };

      button.addEventListener('click', async () => {
        if (audio.paused) {
          try {
            await audio.play();
          } catch {
            time.textContent = '오류';
          }
        } else {
          audio.pause();
        }
      });

      audio.addEventListener('play', () => {
        button.textContent = '❚❚';
        button.setAttribute('aria-label', '음성 일시정지');
      });
      audio.addEventListener('pause', () => {
        if (!audio.ended) {
          button.textContent = '▶';
          button.setAttribute('aria-label', '음성 계속 재생');
        }
      });
      audio.addEventListener('ended', () => {
        button.textContent = '▶';
        button.setAttribute('aria-label', '음성 다시 재생');
      });
      audio.addEventListener('loadedmetadata', () => {
        seek.max = audio.duration || 100;
        time.textContent = formatTime(audio.duration);
      });
      audio.addEventListener('timeupdate', () => {
        seek.value = audio.currentTime;
        time.textContent = formatTime(audio.currentTime);
      });
      seek.addEventListener('input', () => {
        if (Number.isFinite(audio.duration)) {
          audio.currentTime = Number(seek.value);
        }
      });
    </script>
  </body>
</html>
