<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>김초나 링크</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7fb; color: #22242f; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      main { width: min(760px, 100%); padding: 28px 20px; }
      .panel { overflow: hidden; border: 1px solid #e8e8f1; border-radius: 28px; background: #fff; box-shadow: 0 16px 42px rgba(62, 70, 116, .10); }
      header { padding: 28px 28px 20px; text-align: center; background: linear-gradient(135deg, #fbfbff, #f1f6ff); border-bottom: 1px solid #eeeeF6; }
      h1 { margin: 0; font-size: clamp(25px, 5vw, 34px); letter-spacing: -.06em; }
      header p { margin: 9px 0 0; color: #77809b; font-size: 14px; }
      .cards { padding: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .card { min-height: 150px; position: relative; overflow: hidden; isolation: isolate; display: flex; align-items: end; padding: 17px; border-radius: 19px; color: #fff; text-decoration: none; background: #30324c; box-shadow: 0 6px 16px rgba(32, 36, 67, .14); transition: transform .18s ease, box-shadow .18s ease; }
      .card::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgba(12,14,28,.92) 0%, rgba(12,14,28,.25) 58%, rgba(12,14,28,.02) 100%); }
      .card:hover, .card:focus-visible { transform: translateY(-4px); box-shadow: 0 12px 25px rgba(32, 36, 67, .22); outline: 3px solid #a9c7ff; outline-offset: 3px; }
      .card img { position: absolute; z-index: -2; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .25s ease; }
      .card:hover img { transform: scale(1.05); }
      .label { display: grid; gap: 3px; text-shadow: 0 1px 3px rgba(0,0,0,.35); }
      .label strong { font-size: 19px; letter-spacing: -.04em; }
      .label span { font-size: 12px; opacity: .85; }
      footer { padding: 4px 24px 22px; text-align: center; color: #a1a6b8; font-size: 12px; }
      @media (max-width: 470px) { main { padding: 12px; } .cards { grid-template-columns: 1fr; } .card { min-height: 135px; } }
    </style>
  </head>
  <body>
    <main><section class="panel" aria-label="김초나 공식 링크">
      <nav class="cards" aria-label="김초나 채널 및 커뮤니티">
        <a class="card" href="https://www.youtube.com/channel/UCavyC9MMT4InRwgaoJRGHXA" target="_blank" rel="noopener noreferrer"><img src="youtube.png" alt="김초나 유튜브" /><span class="label"><strong>김초나 유튜브</strong><span>YouTube Channel ↗</span></span></a>
        <a class="card" href="https://www.youtube.com/@초나다시보기" target="_blank" rel="noopener noreferrer"><img src="replay.png" alt="김초나 다시보기" /><span class="label"><strong>김초나 다시보기</strong><span>YouTube Archive ↗</span></span></a>
        <a class="card" href="https://x.com/kimchona" target="_blank" rel="noopener noreferrer"><img src="x.png" alt="김초나 X" /><span class="label"><strong>김초나 X</strong><span>@kimchona ↗</span></span></a>
        <a class="card" href="https://cafe.naver.com/chona" target="_blank" rel="noopener noreferrer"><img src="cafe.png" alt="김초나 팬카페" /><span class="label"><strong>김초나 팬카페</strong><span>NAVER Cafe ↗</span></span></a>
      </nav>
    </section></main>
  </body>
</html>
